name: Trendfolge Monatssignal

# 1) Monatssignal: werktags 17:15/20:15 UTC (Xetra-Schluss 17:30 MEZ/MESZ). Das Skript prueft
#    selbst, ob heute der letzte Xetra-Handelstag ist, und laeuft pro Monat nur einmal.
# 2) Telegram-Befehle (/buy, /status): alle 15 Min. werktags 06-21 UTC per getUpdates.
#    Gebucht wird zum Kurs zum Zeitpunkt der Nachricht, nicht der Verarbeitung.
#    Im selben Takt misst spread_sampler.py die gettex-Spreads (06-20 UTC = gettex-Handelszeit),
#    freitags 20:15 UTC kommt der Spread-Bericht per Telegram.
on:
  schedule:
    - cron: '15 17 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '*/15 6-21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (nur Telegram), force (rechnen + speichern) oder poll (Befehle)'
        required: true
        default: preview
        type: choice
        options: [preview, force, poll, spreads]

concurrency:
  group: trend-allocator
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Trendfolge
        env:
          # PUBLIC Repo: Credentials kommen ausschliesslich aus Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ETF_TELEGRAM_TOKEN: ${{ secrets.ETF_TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "spreads" ]; then
            python spread_sampler.py --report
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python trend_allocator.py --${{ inputs.mode }}
          elif [ "${{ github.event.schedule }}" = "*/15 6-21 * * 1-5" ]; then
            python trend_allocator.py --poll
            python spread_sampler.py || echo "Spread-Messung fehlgeschlagen"
          else
            python trend_allocator.py --poll
            python trend_allocator.py
            if [ "${{ github.event.schedule }}" = "15 20 * * 1-5" ] && [ "$(date -u +%u)" = "5" ]; then
              python spread_sampler.py --report || echo "Spread-Bericht fehlgeschlagen"
            fi
          fi
