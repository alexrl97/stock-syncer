name: Nasdaq 15m Sync

on:
  repository_dispatch:
    types: [market_trigger]
  workflow_dispatch:

# Noetig, damit der Job qqqm_last_signal.txt zurueck-committen darf (Dedup-Persistenz).
permissions:
  contents: write

# Kein paralleles Ueberschreiben der Dedup-Datei durch ueberlappende 15-min-Laeufe.
concurrency:
  group: nasdaq-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Script
        env:
          # PUBLIC Repo: Credentials kommen ausschliesslich aus Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ETF_TELEGRAM_TOKEN: ${{ secrets.ETF_TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python stock_syncer.py

      # QQQM-Dedup-Status zurueck-committen, sonst sendet jeder Lauf erneut.
      - name: QQQM-Signalstatus committen
        if: always()
        run: |
          git config user.name "stock_syncer"
          git config user.email "actions@github.com"
          git add -A qqqm_last_signal.txt qqqm_exit_date.txt
          if ! git diff --cached --quiet; then
            git commit -m "stock_syncer: qqqm signal/exit state update"
            git pull --rebase --autostash origin main
            git push
          fi
